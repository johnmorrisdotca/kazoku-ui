<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self'; img-src data:; style-src 'self' 'nonce-kazoku'; connect-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Kazoku UI: the controls under style-src with a nonce</title>
  <meta name="description" content="The view controls on a page whose style-src allows only its own files and one nonce, in the browsers that cannot adopt a stylesheet." />
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
<main>
  <header class="top"><h1>Kazoku UI <span class="sub">style-src with a nonce</span></h1><kazoku-page-header name="Kazoku UI" what="the controls under style-src with a nonce" what-ja="nonce付きstyle-srcでの表示の操作" description="The view controls on a page whose style-src allows only its own files and one nonce, in the browsers that cannot adopt a stylesheet." description-ja="style-srcが同じサイトのファイルと一つのnonceだけを許すページでの、表示の操作です。スタイルシートを取り込めないブラウザでの動きも確かめます。" sheets="print.html" meta data-testid="page-header"></kazoku-page-header></header>
  <p class="intro">This page allows no inline style: <code>style-src 'self' 'nonce-kazoku'</code>. The view controls still draw in full. Add <code>?fallback</code> to hide the constructable-stylesheet API and see the <code>&lt;style&gt;</code> route.</p>
  <div class="scene" id="scene" tabindex="0" role="group" aria-label="View"></div>
  <kazoku-view-controls id="controls" for="scene" nonce="kazoku" data-testid="controls"></kazoku-view-controls>
  <kazoku-theme-switch id="theme" nonce="kazoku" data-testid="theme"></kazoku-theme-switch>
  <kazoku-language-picker id="language" nonce="kazoku" data-testid="language"></kazoku-language-picker>
  <kazoku-save-image id="saver" for="scene" name="scene" nonce="kazoku" data-testid="saver"></kazoku-save-image>
  <output class="readout" id="status" data-testid="status" aria-live="off"></output>
  <kazoku-page-credits credits="Kazoku UI is MIT-licensed, by John Morris. This page draws its own shapes and uses no outside data." credits-ja="Kazoku UIは、John MorrisによるMITライセンスのパッケージです。このページは自前の図形を描き、外部のデータは使っていません。" data-testid="page-credits"></kazoku-page-credits>
</main>
<script type="module" src="frame.js"></script>
<script type="module" src="csp.js"></script>
</body>
</html>
