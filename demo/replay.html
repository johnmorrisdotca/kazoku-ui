<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Kazoku UI: replay bar</title>
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
<main>
  <header class="top">
    <h1>Kazoku UI <span class="sub" data-say="title">replay bar</span></h1>
    <div class="tools">
      <kazoku-language-picker id="language" languages="en ja" address storage="kazoku-demo-lang" data-testid="language"></kazoku-language-picker>
      <kazoku-theme-switch id="theme" address storage="kazoku-demo-theme" data-testid="theme"></kazoku-theme-switch>
    </div>
  </header>
  <p class="intro nav"><a href="index.html" data-say="back">The view controls</a> · <a href="speed.html" data-say="speed">Speed buttons</a></p>
  <p class="intro" data-say="intro">Play, pause, back to the start and repeat, with the family's speed buttons on the same row. The bar reports the choice. The page moves the thing.</p>
  <div class="targets">
    <section class="target">
      <kazoku-replay-bar id="bar" address steps="1 60 600" data-testid="bar"></kazoku-replay-bar>
      <output id="out" data-testid="out"></output>
    </section>
  </div>
</main>
<script type="module" src="replay.js"></script>
</body>
</html>
