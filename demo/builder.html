<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Kazoku UI: build a part and copy the code</title>
  <link rel="stylesheet" href="demo.css" />
</head>
<body class="wide">
<main>
  <header class="top">
    <h1>Kazoku UI <span class="sub" data-say="sub">builder</span></h1>
    <div class="tools">
      <kazoku-language-picker id="language" languages="en ja" address storage="kazoku-demo-lang" data-testid="language"></kazoku-language-picker>
      <kazoku-theme-switch id="theme" address storage="kazoku-demo-theme" data-testid="theme"></kazoku-theme-switch>
    </div>
  </header>
  <p class="intro nav"><a href="index.html" data-say="back">The view controls</a> · <a href="layouts.html" data-say="layouts">Layouts</a> · <a href="address.html" data-say="address">Choices kept in the address</a></p>
  <p class="intro" data-say="intro">Choose a part, set it, see it, and copy the code. Every choice is kept in the address, so a link opens the same setup.</p>
  <div class="row"><span class="name" id="part-name" data-say="part">Part</span><div class="seg" id="parts" role="group" aria-labelledby="part-name" data-testid="parts"></div></div>
  <div class="builder">
    <section class="panel preview" aria-labelledby="preview-title">
      <h2 id="preview-title" data-say="preview">Preview</h2>
      <div id="stage" class="stagebox" data-testid="stage"></div>
    </section>
    <section class="panel" aria-labelledby="options-title">
      <h2 id="options-title" data-say="options">Options</h2>
      <div id="options" data-testid="options"></div>
    </section>
  </div>
  <section class="panel" aria-labelledby="code-title">
    <h2 id="code-title" data-say="code">The code</h2>
    <div class="snippet"><pre class="code" id="code-box"><code id="code" data-testid="code"></code></pre><button class="pill copy" id="copy" type="button" data-say="copy">Copy</button></div>
  </section>
</main>
<script type="module" src="builder.js"></script>
</body>
</html>
