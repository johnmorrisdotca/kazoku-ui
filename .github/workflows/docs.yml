# The documentation's checks: the API reference is current, every guide has its Japanese page, every link and picture is there, and every example in the
# README and the guides runs (Node for the scripts, headless Chromium in software for the HTML). Free on a public repository.
name: Docs
on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/**', 'src/**', 'scripts/docs.mjs', 'scripts/check-readme-examples.mjs', 'CHANGELOG.md', '.github/workflows/docs.yml', '.github/actions/playwright/**']
  pull_request:
    paths: ['README.md', 'docs/**', 'src/**', 'scripts/docs.mjs', 'scripts/check-readme-examples.mjs', 'CHANGELOG.md', '.github/workflows/docs.yml', '.github/actions/playwright/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    # The Playwright image, so the HTML examples' Chromium needs no apt mirror (see the demo job in ci.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - run: pnpm test:readme
