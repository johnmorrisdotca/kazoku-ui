name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  demo:
    # One job a Playwright project (the four are the same tests at a desk's and a phone's width in Chromium and in WebKit). The desk's Chromium draws the renderer page in software, so it is dealt out to four jobs (`--shard`).
    # 25 minutes: the one demo job ran 14:44 of 15 on main 5af830f and was cancelled on 2026-11-10 (KAZOKU-UI-96).
    name: demo (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium-desk, shard: 1/4 }
          - { project: chromium-desk, shard: 2/4 }
          - { project: chromium-desk, shard: 3/4 }
          - { project: chromium-desk, shard: 4/4 }
          - { project: chromium-phone, shard: 1/2 }
          - { project: chromium-phone, shard: 2/2 }
          - { project: webkit-desk, shard: 1/1 }
          - { project: webkit-phone, shard: 1/1 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ startsWith(matrix.project, 'webkit') && 'webkit' || 'chromium' }}
      - name: The demo, played in one browser at one width (pnpm test:demo plays all four)
        run: pnpm test:demo:one --project=${{ matrix.project }} --shard=${{ matrix.shard }}
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports
        run: pnpm test:package
  commits:
    # A pushed commit message never names an AI as author or co-author.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI attribution in the pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$BEFORE..HEAD"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || range="HEAD~1..HEAD"
          if git log --format='%an %ae%n%cn %ce%n%B' "$range" | grep -i -E 'co-authored-by:.*(claude|anthropic|openai|chatgpt|gpt)|noreply@anthropic|noreply@openai'; then
            echo "A commit names an AI as author (see AGENTS.md: no AI attribution)"; exit 1
          fi
