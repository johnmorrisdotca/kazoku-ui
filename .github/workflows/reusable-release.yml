name: Reusable release
# One release for every package repo. A repo's own release.yml calls this (see docs/release-workflow.md):
#
#   jobs:
#     release:
#       uses: johnmorrisdotca/kazoku-ui/.github/workflows/reusable-release.yml@<a release tag>
#
# It publishes by npm trusted publishing: no token and no secret. The trusted-publisher entry on npmjs.com names the
# CALLING workflow's file (the repo's own release.yml), not this one. Both the caller and this workflow need
# `id-token: write`, and the caller needs `contents: write` to tag.
on:
  workflow_call:
    inputs:
      node-version:
        description: Node version for the checks and the publish (22.14 or later; trusted publishing needs it)
        type: string
        default: "24"
      install-command:
        type: string
        default: pnpm install --frozen-lockfile
      check-command:
        description: The repo's check script, run before anything is published
        type: string
        default: pnpm check
      freeze-command:
        description: A package with live 3D sets this to its freeze test (for example `pnpm test:freeze`); Chromium is installed by the bounded Playwright action, then the test runs before anything is published. Empty for a package with no WebGL.
        type: string
        default: ""
      require-ci-workflow:
        description: "The file name of the repo's CI workflow (for example `ci.yml`). When a successful run of it exists for this exact commit, the check and the freeze are skipped and the release builds, tags and publishes. When no passing run is found, the check and the freeze still run. Empty (the default) always runs them. Reading the runs needs no permission on a public repository; a private one's caller must also grant `actions: read`."
        type: string
        default: ""
      github-release:
        description: Also make a GitHub release with the packed tarball (notes from scripts/release-notes.mjs when the repo has it, else generated)
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    # 120 minutes: twice the slowest release job seen (38 minutes for the whole job on 2026-11-12, an upper bound on its freeze) plus the 35-minute install worst case, rounded up. GitHub's own limit is 360.
    timeout-minutes: 120
    steps:
      - name: Only from main, or from a version tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo "::error::Run the release from main (or push a v<version> tag), not from $GITHUB_REF"; exit 1 ;;
          esac
      - name: CI has succeeded on this commit
        if: inputs.require-ci-workflow != ''
        env:
          CI_WORKFLOW: ${{ inputs.require-ci-workflow }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any completed, successful run of the workflow on this commit counts (a green rerun beats an earlier red one).
          URL="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$CI_WORKFLOW/runs?head_sha=$GITHUB_SHA&per_page=100"
          RUNS="$RUNNER_TEMP/ci-runs.json"
          ask() { curl -sS -o "$RUNS" -w '%{http_code}' -H 'Accept: application/vnd.github+json' "$@" "$URL"; }
          CODE="$(ask -H "Authorization: Bearer $GH_TOKEN" || true)"
          # A token without `actions: read` may be refused where a public repository's runs are open to anyone: ask again without it.
          [ "$CODE" = 200 ] || CODE="$(ask || true)"
          # A passing run on this commit, on any branch, means the check and the freeze already happened. Anything else still runs them.
          if [ "$CODE" != 200 ]; then
            echo "SKIP_REPEAT=no" >> "$GITHUB_ENV"
            echo "Could not read the runs of $CI_WORKFLOW (HTTP $CODE). A private repository's release.yml needs actions: read in its permissions. The check and the freeze still run."
            exit 0
          fi
          echo "The runs of $CI_WORKFLOW on $GITHUB_SHA:"
          jq -r '.workflow_runs[] | "  \(.status) \(.conclusion) \(.html_url)"' "$RUNS"
          if [ "$(jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length' "$RUNS")" -ge 1 ]; then
            echo "SKIP_REPEAT=yes" >> "$GITHUB_ENV"
            echo "$CI_WORKFLOW has succeeded on $GITHUB_SHA. The check and the freeze are not run again."
          else
            echo "SKIP_REPEAT=no" >> "$GITHUB_ENV"
            echo "No passing run of $CI_WORKFLOW on $GITHUB_SHA. The check and the freeze still run."
          fi
          rm -f "$RUNS"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: The tag is the version in package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$VERSION, the version in package.json"
            exit 1
          fi
          # a tag that already exists must be this commit (an annotated tag lists its commit last)
          SHA="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f1)"
          if [ -n "$SHA" ] && [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG already exists on another commit ($SHA); this is $GITHUB_SHA"
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "NAME=$NAME"
            echo "TAG=$TAG"
            echo "TAG_EXISTS=$([ -n "$SHA" ] && echo yes || echo no)"
          } >> "$GITHUB_ENV"
      - name: Is this version already on npm?
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "ON_NPM=yes" >> "$GITHUB_ENV"
            echo "$NAME@$VERSION is already on npm: nothing to publish."
          else
            echo "ON_NPM=no" >> "$GITHUB_ENV"
          fi
      - name: Install
        if: env.ON_NPM == 'no'
        run: ${{ inputs.install-command }}
      - name: The repo's check
        if: env.ON_NPM == 'no' && env.SKIP_REPEAT != 'yes'
        run: ${{ inputs.check-command }}
      # dist is not in git, and the publish step ignores scripts, so a skipped check still has to build what the tarball ships.
      - name: Build the files the tarball ships
        if: env.ON_NPM == 'no' && env.SKIP_REPEAT == 'yes'
        run: pnpm build
      # Named by repository and tag, not by a path here: this workflow runs in the caller's checkout, which does not have this action.
      - name: Browsers for the freeze test
        if: env.ON_NPM == 'no' && env.SKIP_REPEAT != 'yes' && inputs.freeze-command != ''
        uses: johnmorrisdotca/kazoku-ui/.github/actions/playwright@v0.41.0
        with:
          browsers: chromium
      - name: The freeze test (packages with live 3D)
        if: env.ON_NPM == 'no' && env.SKIP_REPEAT != 'yes' && inputs.freeze-command != ''
        run: ${{ inputs.freeze-command }}
      - name: Tag the commit, if the tag is missing
        if: env.TAG_EXISTS == 'no'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Publish to npm by trusted publishing
        if: env.ON_NPM == 'no'
        run: |
          npm install -g npm@latest
          npm pack --ignore-scripts
          npm publish --access public --provenance --ignore-scripts
      - name: Attach the tarball to a GitHub release
        if: inputs.github-release && env.ON_NPM == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.tgz --clobber
          else
            if [ -f scripts/release-notes.mjs ] && node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"; then
              gh release create "$TAG" ./*.tgz --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
            else
              gh release create "$TAG" ./*.tgz --title "$TAG" --generate-notes --verify-tag
            fi
          fi
