name: Release
# The steps are in reusable-release.yml, shared by every package repo (docs/release-workflow.md).
# Run by hand (Actions → Release → Run workflow) from main, or push a v<version> tag.
#
# npm trusts THIS file by name (npmjs.com → the package → Settings → Trusted Publisher → workflow
# filename release.yml), so publishing needs no token and no secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    uses: ./.github/workflows/reusable-release.yml
    with:
      github-release: true
